# OnePlus 9 (lemonade) DTBO 打包配置
# 用法（在项目根目录）：
#   python3 src/project-tree-droidian/system/libufdt/utils/src/mkdtboimg.py \
#       cfg_create dist/kernel/dtbo.rebuilt.img config/dtbo_config.cfg --dtb-dir dist/kernel
#
# 说明：
#   - 全局项必须缩进；条目为文件名一行，其后缩进项为该条目的 id/rev
#   - ⚠️ 当前 id/rev 全为 0（占位）。stock dtbo.img 解包后需按实际
#     dt_table 条目回填，否则 bootloader 可能无法匹配 overlay。
#   - 条目顺序需与 stock 一致（面板匹配依赖 id/rev，不依赖顺序，但为可复现先按 stock 排）
    page_size=2048
    version=0

lemonade-19825-overlay.dtbo
lemonadev-2080a-overlay.dtbo
lemonadep-19815-overlay.dtbo
lemonadep-19815-overlay-t0.dtbo
lahaina-mtp-overlay.dtbo
lahaina-mtp-v2-overlay.dtbo
lahaina-mtp-v2.1-overlay.dtbo
